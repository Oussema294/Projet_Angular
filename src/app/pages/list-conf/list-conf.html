
<div class="container mt-4">

  <h2 class="text-center mb-4">Liste des conférences</h2>

  <table class="table table-bordered table-striped table-hover">

    <thead class="table-dark">
    <tr>
      <th>Title</th>
      <th>Date</th>
      <th>Available places</th>
      <th>Participate</th>
    </tr>
    </thead>

    <tbody>

      @for (conf of list; track conf.title) {
        <tr>

          <td>{{conf.title}}</td>

          <td>{{conf.date}}</td>

          <td>
            {{conf.nbrMax - conf.nbrReservation}}
          </td>

          <td>
            <button class="btn btn-sm btn-primary">
              Participate
            </button>
          </td>

        </tr>
      }

    </tbody>

  </table>

</div>
