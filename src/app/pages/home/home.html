<table class="table">
  <tr>
    <th>title</th>
    <th>Date</th>
    <th>Available places</th>
    <th>Particpite</th>


    <th></th>


  </tr>


  @for (conf of list; track conf.title){
  <tr>
    <td>{{conf.title}}</td>
    <td>{{conf.date}}</td>
    <td>{{conf.nbrMax-conf.nbrReservation}}</td>
    <td><button class ="btn btn-small btn-success" [disabled]="conf.nbrMax-conf.nbrReservation"

      (click)="participate(conf)">
      participate
    </button></td>

  </tr>}


</table>
